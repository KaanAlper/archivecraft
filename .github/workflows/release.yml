name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libgl1-mesa-dev libegl1-mesa-dev pkg-config fuse libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: cargo build --release --bin archivecraft --bin archivecraft-cli

      - name: Package tar.gz
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          mkdir -p dist stage-tar
          cp target/release/archivecraft target/release/archivecraft-cli README.md LICENSE-MIT LICENSE-APACHE stage-tar/
          tar -czf "dist/archivecraft-${VER}-linux-x86_64.tar.gz" -C stage-tar .

      - name: Package .deb
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          ROOT="stage-deb"
          mkdir -p "$ROOT/DEBIAN" \
                   "$ROOT/usr/bin" \
                   "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons/hicolor/256x256/apps"
          install -m 0755 target/release/archivecraft "$ROOT/usr/bin/archivecraft"
          install -m 0755 target/release/archivecraft-cli "$ROOT/usr/bin/archivecraft-cli"
          install -m 0644 assets/archivecraft.png "$ROOT/usr/share/icons/hicolor/256x256/apps/archivecraft.png"
          cat > "$ROOT/usr/share/applications/archivecraft.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ArchiveCraft
          GenericName=Archive manager
          Comment=Open, create and unpack archives
          Exec=/usr/bin/archivecraft %F
          Icon=archivecraft
          Terminal=false
          Categories=Utility;Archiving;Compression;
          MimeType=application/zip;application/x-zip;application/x-zip-compressed;application/x-7z-compressed;application/x-tar;application/x-compressed-tar;application/gzip;application/x-xz-compressed-tar;application/x-zstd-compressed-tar;application/vnd.rar;application/x-rar-compressed;application/java-archive;application/x-cd-image;application/x-iso9660-image;
          EOF
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: archivecraft
          Version: ${VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Kaan Alper <KaanAlper@users.noreply.github.com>
          Description: Open-source archive manager in Rust
           Create, inspect, test, repair and unpack ZIP, JAR, 7z, TAR, ISO and RAR archives.
          EOF
          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -f -t /usr/share/icons/hicolor || true
          fi
          EOF
          chmod 0755 "$ROOT/DEBIAN/postinst"
          dpkg-deb --build "$ROOT" "dist/archivecraft-${VER}-linux-x86_64.deb"

      - name: Package AppImage
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          APPDIR="ArchiveCraft.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          install -m 0755 target/release/archivecraft "$APPDIR/usr/bin/archivecraft"
          install -m 0755 target/release/archivecraft-cli "$APPDIR/usr/bin/archivecraft-cli"
          install -m 0644 assets/archivecraft.png "$APPDIR/archivecraft.png"
          install -m 0644 assets/archivecraft.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/archivecraft.png"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/archivecraft" "$@"
          EOF
          chmod 0755 "$APPDIR/AppRun"
          cat > "$APPDIR/archivecraft.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ArchiveCraft
          GenericName=Archive manager
          Comment=Open, create and unpack archives
          Exec=archivecraft %F
          Icon=archivecraft
          Terminal=false
          Categories=Utility;Archiving;Compression;
          EOF
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/archivecraft-${VER}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Determine version
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: cargo build --release --bin archivecraft --bin archivecraft-cli

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.ver }}"
          New-Item -ItemType Directory -Force -Path dist, stage-win | Out-Null
          Copy-Item target/release/archivecraft.exe, target/release/archivecraft-cli.exe, README.md, LICENSE-MIT, LICENSE-APACHE stage-win/
          Compress-Archive -Path stage-win/* -DestinationPath "dist/archivecraft-$ver-windows-x64-portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/*

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
